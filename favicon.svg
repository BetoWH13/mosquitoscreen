<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Simple mosquito net grid pattern -->
  <rect width="32" height="32" fill="#2c3e50"/>
  
  <!-- Net grid lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.8">
    <!-- Vertical lines -->
    <line x1="8" y1="0" x2="8" y2="32"/>
    <line x1="16" y1="0" x2="16" y2="32"/>
    <line x1="24" y1="0" x2="24" y2="32"/>
    
    <!-- Horizontal lines -->
    <line x1="0" y1="8" x2="32" y2="8"/>
    <line x1="0" y1="16" x2="32" y2="16"/>
    <line x1="0" y1="24" x2="32" y2="24"/>
  </g>
  
  <!-- Simple mosquito silhouette in center -->
  <g fill="#ff6b6b">
    <!-- Body -->
    <ellipse cx="16" cy="16" rx="2" ry="4"/>
    <!-- Wings -->
    <ellipse cx="14" cy="15" rx="3" ry="1.5" opacity="0.7"/>
    <ellipse cx="18" cy="15" rx="3" ry="1.5" opacity="0.7"/>
  </g>
  
  <!-- X mark over mosquito -->
  <g stroke="#ff6b6b" stroke-width="2" stroke-linecap="round">
    <line x1="12" y1="12" x2="20" y2="20"/>
    <line x1="20" y1="12" x2="12" y2="20"/>
  </g>
</svg>
